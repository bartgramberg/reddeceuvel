<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word ambassadeur — Red de Ceuvel</title>
<meta name="description" content="Word ambassadeur van De Ceuvel en deel wat deze plek voor jou betekent.">
<meta name="theme-color" content="#2a1a12">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=League+Spartan:wght@700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body data-pagina="ambassadeurs">
<main class="sectie">
  <div class="binnen">
    <h1 class="titel verf" style="margin-bottom:40px">Word <em>ambassadeur</em></h1>
    <div class="aanmeld-grid">
      <div class="plaat" id="formulier-plaat">
        <form class="formulier" id="amb-form" novalidate>
          <div class="veld">
            <label class="foto-drop" id="foto-drop">
              <input type="file" id="foto" accept="image/*">
              <span class="foto-drop-vak" id="foto-vak" aria-hidden="true">+</span>
              <span><strong id="foto-titel">Jouw foto</strong><span>Een portret waarop je goed te zien bent. Klik of sleep hierheen.</span></span>
            </label>
          </div>

          <div class="rij-2">
            <div class="veld"><label for="voornaam">Voornaam <span class="verplicht">*</span></label><input id="voornaam" name="voornaam" autocomplete="given-name" required maxlength="60"></div>
            <div class="veld"><label for="achternaam">Achternaam <span class="verplicht">*</span></label><input id="achternaam" name="achternaam" autocomplete="family-name" required maxlength="80"></div>
          </div>

          <div class="veld">
            <label for="wie">Wie ben je? <span class="verplicht">*</span></label>
            <p class="hulp">Bijvoorbeeld: buurvrouw, muzikant, ondernemer op De Ceuvel.</p>
            <input id="wie" name="wie" required maxlength="120">
          </div>

          <div class="veld">
            <label for="verhaal">Wat betekent De Ceuvel voor jou? <span class="verplicht">*</span></label>
            <textarea id="verhaal" name="verhaal" required maxlength="500"></textarea>
            <span class="teken-teller" id="tekens">0 / 500</span>
          </div>

          <div class="rij-2">
            <div class="veld"><label for="email">E-mail <span class="verplicht">*</span></label><input id="email" name="email" type="email" autocomplete="email" required maxlength="120"></div>
            <div class="veld"><label for="telefoon">Telefoon</label><input id="telefoon" name="telefoon" type="tel" autocomplete="tel" maxlength="30"><p class="hulp">Alleen voor pers en media.</p></div>
          </div>

          <div class="veld"><label for="link">Instagram of website</label><input id="link" name="link" placeholder="@jouwnaam" maxlength="200"></div>

          <label class="vink"><input type="checkbox" name="toestemmingWebsite" required><span>Mijn naam, verhaal en foto mogen op reddeceuvel.nl en deceuvel.nl. <span class="verplicht">*</span></span></label>
          <label class="vink"><input type="checkbox" name="toestemmingSocial" checked><span>Ook op social media en in campagnemateriaal.</span></label>
          <label class="vink"><input type="checkbox" name="updates" checked><span>Houd me op de hoogte.</span></label>
          <div class="hp" aria-hidden="true"><label>Laat leeg <input name="website_hp" tabindex="-1" autocomplete="off"></label></div>

          <p class="fout" id="fout" hidden></p>
          <button class="knop knop-blauw knop-xl" type="submit" style="width:100%">Word ambassadeur</button>
          <p class="privacy">Je e-mail en telefoonnummer worden nooit gepubliceerd. Iets aanpassen of laten weghalen? Mail ons.</p>
        </form>
      </div>
      <aside>
        <p class="label" id="voorbeeld-label">Zo kom je op de site</p>
        <div id="voorbeeld"></div>
      </aside>
    </div>
  </div>
</main>

<template id="bedankt-tpl">
  <div class="bedankt">
    <span class="stempel verf">Ambassadeur<small>Welkom</small></span>
    <h2 class="titel-m">Dank je, <span data-naam></span></h2>
    <p>We lezen je verhaal en zetten het zo snel mogelijk online.</p>
    <div class="deelrij" id="deelrij"></div>
    <a class="knop knop-rood" href="petitie.html">Teken ook de petitie</a>
  </div>
</template>

<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/api.js?v=3"></script>
<script src="assets/js/main.js?v=3"></script>
<script>
(function () {
  var form = document.getElementById("amb-form"), fout = document.getElementById("fout");
  var voorbeeld = document.getElementById("voorbeeld"), fotoData = "";
  function w(n) { var el = form.elements[n]; return el ? el.value.trim() : ""; }

  function ververs() {
    voorbeeld.innerHTML = RDC.ambKaart({
      naam: (w("voornaam") + " " + w("achternaam")).trim() || "Jouw naam",
      wie: w("wie") || "Wie ben jij?",
      verhaal: w("verhaal") || "Wat betekent De Ceuvel voor jou?",
      foto: fotoData
    }, 1);
  }
  form.addEventListener("input", ververs);
  ververs();

  var ta = document.getElementById("verhaal"), tt = document.getElementById("tekens");
  ta.addEventListener("input", function () { tt.textContent = ta.value.length + " / 500"; tt.classList.toggle("bijna", ta.value.length > 450); });

  // foto verkleinen in de browser (max 1000px, JPEG)
  var input = document.getElementById("foto"), drop = document.getElementById("foto-drop"), vak = document.getElementById("foto-vak"), titel = document.getElementById("foto-titel");
  ["dragenter", "dragover"].forEach(function (e) { drop.addEventListener(e, function () { drop.classList.add("sleep"); }); });
  ["dragleave", "drop"].forEach(function (e) { drop.addEventListener(e, function () { drop.classList.remove("sleep"); }); });
  input.addEventListener("change", function () {
    var file = input.files && input.files[0]; if (!file) return;
    titel.textContent = "Foto verwerken…";
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      fotoData = c.toDataURL("image/jpeg", 0.85);
      URL.revokeObjectURL(url);
      vak.style.backgroundImage = "url(" + fotoData + ")"; vak.textContent = "";
      titel.textContent = "Mooi. Klik om te wisselen.";
      ververs();
    };
    img.onerror = function () { titel.textContent = "Deze foto lukt niet. Probeer een JPG of PNG."; };
    img.src = url;
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    fout.hidden = true;
    if (!form.checkValidity()) {
      var eerste = form.querySelector(":invalid");
      fout.textContent = eerste && eerste.name === "toestemmingWebsite" ? "Zonder toestemming kunnen we je verhaal niet plaatsen." : "Vul alle velden met een * in.";
      fout.hidden = false; if (eerste) eerste.focus(); return;
    }
    var knop = form.querySelector("button[type=submit]");
    knop.disabled = true; knop.textContent = "Versturen…";
    RDC.api.aanmelden({
      type: "ambassadeur",
      voornaam: w("voornaam"), achternaam: w("achternaam"), wie: w("wie"), verhaal: w("verhaal"),
      email: w("email"), telefoon: w("telefoon"), link: w("link"), foto: fotoData,
      toestemmingWebsite: form.elements.toestemmingWebsite.checked,
      toestemmingSocial: form.elements.toestemmingSocial.checked,
      updates: form.elements.updates.checked,
      website_hp: w("website_hp")
    }).then(function (r) {
      if (!r || !r.ok) throw new Error((r && r.error) || "Er ging iets mis.");
      var plaat = document.getElementById("formulier-plaat"), naam = w("voornaam");
      plaat.innerHTML = document.getElementById("bedankt-tpl").innerHTML;
      plaat.querySelector("[data-naam]").textContent = naam;
      RDC.deelknoppen(plaat.querySelector("#deelrij"), "Ik ben ambassadeur van De Ceuvel. Word jij het ook?", RDC_CONFIG.SITE_URL + "/ambassadeurs.html");
      document.getElementById("voorbeeld-label").textContent = "Jouw kaart · wacht op goedkeuring";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }).catch(function (err) {
      fout.textContent = err.message || "Er ging iets mis. Probeer het opnieuw.";
      fout.hidden = false; knop.disabled = false; knop.textContent = "Word ambassadeur";
    });
  });
})();
</script>
</body>
</html>
