<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambassadeurs — Red de Ceuvel</title>
<meta name="description" content="Buren, makers, ondernemers, kinderen, bezoekers en de natuur. Dit is wat De Ceuvel voor ons betekent.">
<meta name="theme-color" content="#2a1a12">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=League+Spartan:wght@700;800;900&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body data-pagina="ambassadeurs">
<main>
  <section class="sectie" style="padding-bottom:48px">
    <div class="binnen">
      <div class="word-blok">
        <div>
          <h1 class="titel-m">Word ambassadeur</h1>
          <p>Deel wat De Ceuvel voor jou betekent, met je naam en je gezicht.</p>
          <div class="teller" id="teller"></div>
          <div class="balk" aria-hidden="true"><i id="balk"></i></div>
        </div>
        <a class="knop knop-xl" href="aanmelden.html">Meld je aan</a>
      </div>
    </div>
  </section>

  <section style="padding-bottom:clamp(64px,9vw,120px)">
    <div class="binnen">
      <p class="lead" style="margin:0 0 40px">Buren, makers, ondernemers, kinderen, bezoekers en de natuur. Dit is wat De Ceuvel voor ons betekent.</p>
      <div class="amb-grid" id="grid"></div>
      <div class="meer-laden"><button class="knop" id="meer" hidden>Meer ambassadeurs</button></div>
    </div>
  </section>
</main>

<script src="assets/js/config.js?v=3"></script>
<script src="assets/js/api.js?v=3"></script>
<script src="assets/js/main.js?v=3"></script>
<script>
(function () {
  var fotos = [
    ["assets/img/foto/kinderen.jpg", "Kinderen op de rand van een woonboot"],
    ["assets/img/foto/pad.webp", "Houten pad door het groen"],
    ["assets/img/foto/concert.jpg", "Optreden voor publiek op het plein"],
    ["assets/img/foto/bord.jpg", "Het toegangsbord van De Ceuvel tussen de bomen"]
  ];
  var PER_KEER = 30, ELKE = 7;
  var grid = document.getElementById("grid"), meer = document.getElementById("meer"), lijst = [], getoond = 0, fotoNr = 0;

  function toon() {
    var html = "";
    lijst.slice(getoond, getoond + PER_KEER).forEach(function (a, j) {
      var i = getoond + j;
      if (i > 0 && i % ELKE === 3) {
        var f = fotos[fotoNr++ % fotos.length];
        html += '<figure class="tussenfoto opkomst"><img src="' + f[0] + '" alt="' + f[1] + '" loading="lazy"></figure>';
      }
      html += RDC.ambKaart(a, i).replace('class="amb ', 'class="opkomst amb ');
    });
    grid.insertAdjacentHTML("beforeend", html);
    getoond = Math.min(lijst.length, getoond + PER_KEER);
    meer.hidden = getoond >= lijst.length;
    RDC.observeer(grid);
  }
  meer.addEventListener("click", toon);

  RDC.api.ambassadeurs().then(function (d) {
    lijst = (d.ambassadeurs || []).slice().sort(function (a, b) { return (b.uitgelicht ? 1 : 0) - (a.uitgelicht ? 1 : 0); });
    var doel = RDC_CONFIG.AMBASSADEURS_DOEL;
    document.getElementById("teller").textContent = lijst.length + " van " + doel + " ambassadeurs";
    requestAnimationFrame(function () { document.getElementById("balk").style.width = Math.min(100, lijst.length / doel * 100) + "%"; });
    if (!lijst.length) { grid.outerHTML = '<div class="leeg">Nog geen ambassadeurs. Word jij de eerste?</div>'; return; }
    toon();
  });
})();
</script>
</body>
</html>
